apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaintbox-deployment
  labels:
    app: complaintbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: complaintbox
  template:
    metadata:
      labels:
        app: complaintbox
    spec:
      containers:
        - name: complaintbox
          image: hr1thik/complaintbox:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: complaintbox-service
  labels:
    app: complaintbox
spec:
  selector:
    app: complaintbox
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: NodePort
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: complaintbox-servicemonitor
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - complaintbox
  selector:
    matchLabels:
      app: complaintbox
  endpoints:
    - port: http
      path: /metrics
      interval: 15s