apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaintbox-deployment
  labels:
    app: complaintbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: complaintbox
  template:
    metadata:
      labels:
        app: complaintbox
    spec:
      containers:
        - name: complaintbox
          image: hr1thik/complaintbox:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: complaintbox-service
spec:
  selector:
    app: complaintbox
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: NodePort