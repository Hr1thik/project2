apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: complaintbox-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Hr1thik/complaintbox.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: complaintbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true