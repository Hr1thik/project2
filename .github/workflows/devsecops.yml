name: ComplaintBox DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-and-sca:
    name: Step 1A - SAST & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Security Scanners & App Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit semgrep
          pip install -r requirements.txt

      - name: Run Bandit (Python SAST)
        run: bandit -r . -ll --exclude ./.venv,./venv

      - name: Run Semgrep (Security Pattern SAST)
        run: semgrep --config=auto --error || true

      - name: Run pip-audit (Dependency Vulnerability Scan)
        run: pip-audit -r requirements.txt || true

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    name: Step 2 - Docker Build & Push
    needs: sast-and-sca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/complaintbox:latest

  dast-scan:
    name: Step 1B - DAST Scan (OWASP ZAP)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Start ComplaintBox Container
        run: |
          docker run -d --name complaintbox-dast -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/complaintbox:latest
          sleep 5
          curl -I http://localhost:8000

      - name: Run OWASP ZAP Baseline Scan
        run: |
          chmod a+w ${{ github.workspace }}
          docker run --rm --network=host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -m 1 -r zap_report.html -I